  font-size: var(--font-size-small) !important;
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options > [aria-current="true"],
.viz-carousel-options > button:hover {
  background: var(--viz-carousel-hover) !important;
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.viz-carousel-controls :is(button, summary):focus-visible {
  outline: 2px solid var(--ring) !important;
  outline-offset: 2px !important;
}

@media (pointer: coarse) {
  .viz-carousel:has(> .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker > summary,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

<style>
#paris-book-360 {width:100%;color:var(--foreground);user-select:none}
#paris-book-360 .book-stage {height:500px;position:relative;perspective:1200px;touch-action:pan-y;cursor:grab}
#paris-book-360 .book-stage:active {cursor:grabbing}
#paris-book-360 .book-scale {position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transform:scale(.98)}
#paris-book-360 .book-solid {width:0;height:0;position:relative;transform-style:preserve-3d;transform:rotateX(-10deg) rotateY(45deg)}
#paris-book-360 .book-face {position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-sizing:border-box}
#paris-book-360 .book-front,#paris-book-360 .book-back {width:300px;height:404px;left:-150px;top:-202px;background:#45c953}
#paris-book-360 .book-front {transform:translateZ(16px)}
#paris-book-360 .book-back {transform:rotateY(180deg) translateZ(16px)}
#paris-book-360 .book-face img {display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}
#paris-book-360 .book-front:after,#paris-book-360 .book-back:after {content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent 2%,rgba(255,255,255,.12) 3%,transparent 5%,transparent 96%,rgba(0,0,0,.06))}
#paris-book-360 .book-spine,#paris-book-360 .book-pages {width:32px;height:404px;left:-16px;top:-202px}
#paris-book-360 .book-spine {transform:rotateY(-90deg) translateZ(150px);background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(255,255,255,.12) 35%,transparent 65%,rgba(0,0,0,.22)),linear-gradient(#42c254 0% 83%,#b40f10 83% 100%)}
#paris-book-360 .book-pages {transform:rotateY(90deg) translateZ(150px);background:repeating-linear-gradient(90deg,#f4f0e6 0px,#f4f0e6 1px,#d8d4c9 1.3px,#f7f4ed 1.8px);border:2px solid #9eb8b8}
#paris-book-360 .book-top,#paris-book-360 .book-bottom {width:300px;height:32px;left:-150px;top:-16px;background:repeating-linear-gradient(0deg,#ece8dd 0px,#ece8dd 1px,#ccc8bd 1.3px,#faf8f2 1.8px);border:2px solid #72b793}
#paris-book-360 .book-top {transform:rotateX(90deg) translateZ(202px)}
#paris-book-360 .book-bottom {transform:rotateX(-90deg) translateZ(202px)}
#paris-book-360 .viz-controls {justify-content:center;margin-bottom:16px}
@media(max-width:460px){#paris-book-360 .book-scale{transform:scale(.76)}#paris-book-360 .book-stage{height:380px}}
#paris-book-360 .book-spine .spine-surface {position:absolute;inset:0;width:100%;height:100%;display:block}
#paris-book-360 .book-spine img {visibility:hidden}
#paris-book-360 .book-spine {background:#ad0a00}
#paris-book-360 .book-front:after {clip-path:polygon(0 0,100% 0,100% 83.125%,0 83.125%)}
</style>










<script>
(()=>{
 const root=document.getElementById('paris-book-360');
 const solid=root.querySelector('.book-solid'),stage=root.querySelector('.book-stage');
 const spineImage=root.querySelector('.book-spine img');
 const spineCanvas=root.querySelector('.spine-surface');
 function paintSpine(){
   const ctx=spineCanvas.getContext('2d',{willReadFrequently:true});
   const w=spineCanvas.width,h=spineCanvas.height,join=Math.round(h*532/640);
   ctx.clearRect(0,0,w,h);
   ctx.drawImage(spineImage,5,4,64,511,0,0,w,join);
   ctx.drawImage(spineImage,5,518,64,111,0,join,w,h-join);
   const pixels=ctx.getImageData(0,join,w,h-join),a=pixels.data;
   for(let i=0;i<a.length;i+=4){
     const white=Math.max(0,Math.min(1,(Math.min(a[i+1],a[i+2])-90)/165));
     a[i]=Math.round(173+(255-173)*white);
     a[i+1]=Math.round(10+(255-10)*white);
     a[i+2]=Math.round(255*white);
     a[i+3]=255;
   }
   ctx.putImageData(pixels,0,join);
 }
 if(spineImage.complete&&spineImage.naturalWidth)paintSpine();else spineImage.addEventListener('load',paintSpine,{once:true});
 const slider=root.querySelector('#paris-angle'),degree=root.querySelector('#paris-degree'),play=root.querySelector('[data-action="play"]');
 let angle=45,tilt=-10,running=!matchMedia("(prefers-reduced-motion: reduce)").matches,last=0,drag=null;
 function update(){const a=((angle%360)+360)%360;solid.style.transform=`rotateX(${tilt}deg) rotateY(${angle}deg)`;slider.value=a;degree.value=Math.round(a)+'°';play.textContent=running?'Pause':'Rotation automatique';play.setAttribute('aria-pressed',String(running));}
 play.addEventListener('click',()=>{running=!running;update()});
 root.querySelectorAll('[data-angle]').forEach(b=>b.addEventListener('click',()=>{running=false;angle=Number(b.dataset.angle);tilt=-10;update()}));
 slider.addEventListener('input',()=>{running=false;angle=Number(slider.value);update()});
 stage.addEventListener('pointerdown',e=>{running=false;drag={x:e.clientX,y:e.clientY,a:angle,t:tilt};stage.setPointerCapture(e.pointerId);update()});
 stage.addEventListener('pointermove',e=>{if(!drag)return;angle=drag.a+(e.clientX-drag.x)*.65;tilt=Math.max(-35,Math.min(30,drag.t-(e.clientY-drag.y)*.22));update()});
 stage.addEventListener('pointerup',()=>drag=null);stage.addEventListener('pointercancel',()=>drag=null);
 function frame(t){if(last&&running&&!document.hidden){angle+=Math.min(t-last,60)*.018;update()}last=t;requestAnimationFrame(frame)}
 update();requestAnimationFrame(frame);
})();
</script><style>
/* Mode « hero » (landing page) : livre seul, sans boutons, à la taille de l'écran */
html.hero-mode body{padding:0;overflow:hidden}
html.hero-mode #paris-book-360{max-width:none}
html.hero-mode #paris-book-360 .viz-controls,html.hero-mode #paris-book-360 .form-label,html.hero-mode #paris-book-360 .form-range{display:none}
html.hero-mode #paris-book-360 .book-stage{height:100vh;perspective:2400px}
</style>
<script>
(()=>{if(!/[?&]hero\b/.test(location.search))return;document.documentElement.classList.add('hero-mode');
const sc=document.querySelector('#paris-book-360 .book-scale');
const fit=()=>{const k=Math.min(innerHeight*.8/404,innerWidth*.62/300);sc.style.transform='scale('+k+')'};fit();addEventListener('resize',fit)})();
</script>
</body>
